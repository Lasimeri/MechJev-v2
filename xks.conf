# MechJev-v2 defaults for the decision engine (backend/build/xks). Every key
# is also an environment variable, and anything already in the environment
# wins. This machine's own values go in xks.local.conf (not tracked) or
# ~/.config/xks/xks.conf (shared with Intel Phi Jev's xks). Shell-sourceable.

# The subject: Qwen3.8-35B-A3B Q4_K_M (empero-ai's distillation), the one
# the Rust xks's 28-of-28 closeness was measured on.
XKS_SUBJECT="$HOME/models/Qwen3.8-35B-A3B/Qwen3.8-35B-A3B-Q4_K_M.gguf"

# Half the layers on the GPU (21 of 41 on the 3090 Ti, 11.5 GB).
XKS_GPU_LAYERS=50%

# Where it answers, and the kill date (seconds without a question before it
# exits and frees the GPU; 0 = never).
XKS_BIND=127.0.0.1:8090
XKS_KILL_DATE=1800

# Lettered options, three rotations of a Choice averaged (Hemi-Sync).
XKS_LAYOUT=letters
XKS_PERMUTATIONS=3
